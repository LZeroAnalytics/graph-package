name: "github.com/LZeroAnalytics/graph-package"
description: |
  Multi-Chain Graph Node Orchestrator
  ==================================
  This Kurtosis package instantiates a complete multi-chain Graph Protocol indexing environment with PostgreSQL database, IPFS node, and per-chain Firehose instances for indexing and querying blockchain data through GraphQL APIs.

  Features
  --------
  - YAML-driven multi-chain configuration
  - Automatic Firehose deployment per chain
  - Template-based substreams and subgraph generation
  - Automated subgraph deployment to Graph Node
  - Support for custom RPC endpoints and block explorers

  Configuration
  -------------
  Provide a YAML configuration file with chain definitions:
  ```yaml
  chains:
    - id: 9312546
      key: "arbitrum-fork"
      name: "Arbitrum Fork"
      rpc_url: "https://your-rpc-url/"
      explorer:
        name: "blockscout"
        api_url: "https://api.arbiscan.io/api"
        url: "https://arbiscan.io"
      start_block: 1100
  
  postgres:
    min_cpu: 10
    max_cpu: 1000
    min_memory: 32
    max_memory: 1024
  
  graph_node:
    log_level: "trace"
  ```

  Usage
  -----
  ```bash
  kurtosis run --enclave multi-chain-test . --args-file config.yaml
  ```

  Services
  --------
  - PostgreSQL: Database for storing indexed data
  - IPFS: Distributed file system for metadata storage
  - Firehose (per chain): Block streaming service for each configured chain
  - Graph Node: Core indexing and query engine with multi-chain support
  - Indexer: Service for building and deploying substreams/subgraphs
